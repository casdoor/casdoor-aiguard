appname = casdoor-aiguard
httpport = 9000
runmode = dev
copyrequestbody = true

# --- Casdoor connection (PDP / OAuth authorization server) ---
# The same connection backs the optional operator login in the Web UI: the
# login button is disabled until aiguard can reach Casdoor with these settings.
# Register <aiguard-url>/callback as a redirect URI on the Casdoor application.
casdoorEndpoint = "http://localhost:8000"
casdoorClientId = ""
casdoorClientSecret = ""
casdoorCertificate = ""
casdoorOrganization = "built-in"
casdoorApplication = "app-built-in"

# --- Interception engine ---
proxyPort = 9090
caCertDir = "./certs"
policyFile = "./conf/policy.yaml"
# automatically install the iptables transparent redirect on startup and remove
# it on shutdown (Linux + root only; ignored elsewhere, where aiguard runs as an
# explicit forward proxy). aiguard excludes its own uid to avoid a redirect loop.
autoTransparentProxy = true

# fail-closed: recognized sensitive operations are denied when Casdoor is unreachable
failClosedOnPdpError = true
# passthrough: unrecognized ordinary traffic is allowed through untouched
passthroughUnrecognized = true
# verdict applied to a step-up rule while CIBA is stubbed (stage 1): "deny" or "allow"
stepUpDefaultAction = "deny"
pdpEnforcePath = "/api/enforce"

# --- Audit ---
auditLogFile = "./logs/audit.log"
# behaviour records pushed by patched agents (the Records page)
recordLogFile = "./logs/record.log"

# --- Agent patching ---
# manifests and file backups that let aiguard undo a patch exactly; losing this
# directory means losing the ability to unpatch cleanly
patchStateDir = "./data/patches"
# endpoint baked into the hooks aiguard installs into agents. Defaults to this
# process on the loopback address; set it explicitly when the agent runs in a
# container or WSL and has to reach the host by another address.
recordsIngestUrl = ""

logConfig = {"adapter":"file", "filename": "logs/aiguard.log", "maxdays":99999, "perm":"0770"}
