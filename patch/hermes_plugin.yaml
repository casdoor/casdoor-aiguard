name: casdoor-aiguard-observer
version: "1.0.0"
description: "Metadata-only behaviour audit for Casdoor AIGuard."
author: Casdoor
kind: standalone
hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - on_session_reset
  - subagent_start
  - subagent_stop
