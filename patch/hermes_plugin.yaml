name: casdoor-aiguard-observer
version: "1.0.0"
description: "Metadata-only behaviour audit for Casdoor AIGuard."
author: Casdoor
kind: standalone
# "provides_hooks" is the key Hermes' manifest parser reads; the callbacks
# themselves are registered from register() in __init__.py.
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - on_session_reset
  - subagent_start
  - subagent_stop
